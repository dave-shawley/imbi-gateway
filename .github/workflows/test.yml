name: "Run Tests"
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: "Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run linters in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            uv run pre-commit run --all-files
            uv run basedpyright
            uv run mypy

  test:
    name: "Automated Tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.12", "3.13", "3.14" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run tests in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          push: never
          imageName: ghcr.io/aweber-imbi/imbi-gateway
          imageTag: python-${{ matrix.python }}
          cacheFrom: ghcr.io/aweber-imbi/imbi-gateway
          buildxPlatform: linux/amd64
          runCmd: uv run pytest
        env:
          PYTHON_VERSION: ${{ matrix.python }}
