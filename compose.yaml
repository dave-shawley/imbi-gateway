services:
  grafana:
    image: grafana/grafana:latest
    ports:
      - 3000
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - jaeger
      - loki
      - prometheus
    volumes:
      - "./ci/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml"
  jaeger:
    image: jaegertracing/jaeger:2.14.0
    ports:
      - 4317 # /v1/traces: OTLP/HTTP ingest
      - 8888 # /metrics: prometheus metrics scraping
      - 16686 # /api/v3/* - OTLP/HTTP query and UI
  loki:
    image: grafana/loki:latest
    ports:
      - 3100
  prometheus:
    image: prom/prometheus:latest
    ports:
      - 9090
    volumes:
      - "./ci/prometheus.yaml:/etc/prometheus/prometheus.yml"
